name: E87N wired bypass firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/e87n-bypass.config'
      - 'package/vendor/e87n-bypass-defaults/**'
      - 'package/vendor/luci-app-e87n-control-center/**'
      - 'package/vendor/e87n-defaults/Makefile'
      - 'target/linux/mediatek/image/filogic.mk'
      - '.github/workflows/e87n-bypass-build.yml'

permissions:
  contents: read

concurrency:
  group: e87n-bypass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib gettext             git libncurses-dev libssl-dev python3 python3-distutils-extra             python3-setuptools rsync swig unzip zlib1g-dev file wget curl             libelf-dev qemu-utils zstd

      - name: Prepare pinned feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Keep the wired-only LuCI and statistics pages without pulling the
          # iwinfo wireless userspace back into the image.
          sed -i 's/ +rpcd-mod-iwinfo//' feeds/luci/modules/luci-mod-network/Makefile
          sed -i 's/ +libiwinfo +rpcd-mod-iwinfo//' feeds/luci/modules/luci-mod-status/Makefile
          sed -i '/+collectd-mod-iwinfo/d' feeds/luci/applications/luci-app-statistics/Makefile
          ! grep -q 'rpcd-mod-iwinfo' feeds/luci/modules/luci-mod-network/Makefile
          ! grep -Eq 'libiwinfo|rpcd-mod-iwinfo' feeds/luci/modules/luci-mod-status/Makefile
          ! grep -q 'collectd-mod-iwinfo' feeds/luci/applications/luci-app-statistics/Makefile

          rm -rf feeds/luci/applications/luci-app-passwall
          rm -f package/feeds/luci/luci-app-passwall

          rm -rf feeds/packages/net/xray-core                  feeds/packages/net/v2ray-geodata                  feeds/packages/net/sing-box                  feeds/packages/net/chinadns-ng                  feeds/packages/net/dns2socks                  feeds/packages/net/ipt2socks                  feeds/packages/net/microsocks                  feeds/packages/net/tcping                  feeds/packages/net/geoview

          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git -C package/passwall-packages checkout b4f719f44343b6f62d5c21e14da0c844b21a58ed
          git -C package/passwall-packages checkout 825aa3a00ad839f3f2521f7e06750a271dabae17 -- xray-core
          grep -qx 'PKG_VERSION:=24.12.31' package/passwall-packages/xray-core/Makefile
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git -C package/passwall-luci checkout d9373af2f74fe9efabcfe57b257a047e445c8e07
          test ! -e package/feeds/luci/luci-app-passwall
          grep -qx 'PKG_VERSION:=26.5.20' package/passwall-luci/luci-app-passwall/Makefile
          sed -i '/^config .*INCLUDE_Geoview$/,+3 s/default y if aarch64||arm||i386||x86_64/default n/' package/passwall-luci/luci-app-passwall/Makefile
          sed -i '/^config .*INCLUDE_SingBox$/,+3 s/default y if aarch64||arm||i386||x86_64/default n/' package/passwall-luci/luci-app-passwall/Makefile
          grep -A3 'INCLUDE_Geoview' package/passwall-luci/luci-app-passwall/Makefile | grep -q '^[[:space:]]*default n$'
          grep -A3 'INCLUDE_SingBox' package/passwall-luci/luci-app-passwall/Makefile | grep -q '^[[:space:]]*default n$'
          rm -rf tmp
      - name: Configure wired-only firmware
        run: |
          cp configs/e87n-bypass.config .config
          make defconfig
          ./scripts/config --disable PACKAGE_wireless-tools
          make defconfig
          ./scripts/diffconfig.sh | tee e87n-bypass.diffconfig

          required_symbols=(
            CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n
            CONFIG_PACKAGE_e87n-bypass-defaults
            CONFIG_PACKAGE_luci-app-e87n-control-center
            CONFIG_PACKAGE_luci-app-passwall
            CONFIG_PACKAGE_xray-core
            CONFIG_PACKAGE_mosdns
            CONFIG_PACKAGE_adguardhome
            CONFIG_PACKAGE_luci-app-ipsec-vpnd
            CONFIG_PACKAGE_luci-app-ddns
            CONFIG_PACKAGE_luci-app-upnp
            CONFIG_PACKAGE_luci-app-vlmcsd
            CONFIG_PACKAGE_luci-app-ttyd
            CONFIG_PACKAGE_luci-app-eqos-mtk
            CONFIG_PACKAGE_luci-app-turboacc-mtk
            CONFIG_PACKAGE_luci-app-wrtbwmon
            CONFIG_PACKAGE_luci-app-statistics
            CONFIG_PACKAGE_luci-app-netdata
            CONFIG_PACKAGE_netdata
            CONFIG_PACKAGE_luci-app-openvpn
            CONFIG_PACKAGE_openvpn-openssl
            CONFIG_PACKAGE_luci-proto-wireguard
            CONFIG_PACKAGE_wireguard-tools
            CONFIG_PACKAGE_kmod-wireguard
            CONFIG_PACKAGE_luci-app-timewol
            CONFIG_PACKAGE_luci-app-ramfree
            CONFIG_PACKAGE_luci-app-watchcat
            CONFIG_PACKAGE_watchcat
          )
          for symbol in "${required_symbols[@]}"; do
            grep -qx "${symbol}=y" .config || {
              echo "missing required symbol: ${symbol}" >&2
              exit 1
            }
          done

          required_ui_files=(
            package/vendor/luci-app-e87n-control-center/root/usr/share/luci/menu.d/luci-app-e87n-control-center.json
            package/vendor/luci-app-e87n-control-center/htdocs/luci-static/resources/view/e87n/fancontrol.js
            package/vendor/luci-app-e87n-control-center/htdocs/luci-static/resources/view/e87n/display.js
            package/vendor/luci-app-e87n-control-center/htdocs/luci-static/resources/view/e87n/mosdns.js
            package/vendor/luci-app-e87n-control-center/htdocs/luci-static/resources/view/e87n/adguardhome.js
          )
          for ui_file in "${required_ui_files[@]}"; do
            test -s "${ui_file}" || {
              echo "missing required LuCI file: ${ui_file}" >&2
              exit 1
            }
          done

          forbidden_regex='(CONFIG_PACKAGE_(sing-box|geoview|docker|dockerd|containerd|runc|luci-app-dockerman|samba4-server|samba4-libs|ksmbd-server|luci-app-samba4|luci-app-ksmbd|luci-app-diskman|luci-app-vsftpd|vsftpd|autoksmbd|autosamba|luci-app-modem|luci-app-WTModem|luci-app-qmodem|luci-app-qmodem-sms|luci-app-qmodem-ttl|qmodem|tom_modem|kmod-cfg80211|kmod-mac80211|kmod-mt76-core|kmod-mt7921e|kmod-mt7922-firmware|wpad-openssl|hostapd-utils|wifi-scripts|wireless-tools|iw|iw-full|iwinfo|libiwinfo|rpcd-mod-iwinfo)=y|CONFIG_PACKAGE_luci-app-passwall_INCLUDE_(SingBox|Geoview)=y)'
          if grep -E "${forbidden_regex}" .config; then
            echo 'forbidden package selected' >&2
            exit 1
          fi

      - name: Download source archives
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify package manifest and images
        run: |
          target=bin/targets/mediatek/filogic
          manifest="$(find "$target" -maxdepth 1 -name '*edgepi_e87n.manifest' -print -quit)"
          sysupgrade="$(find "$target" -maxdepth 1 -name '*edgepi_e87n-squashfs-sysupgrade.bin' -print -quit)"
          initramfs="$(find "$target" -maxdepth 1 -name '*edgepi_e87n-initramfs-kernel.bin' -print -quit)"
          test -s "$manifest"
          test -s "$sysupgrade"
          test -s "$initramfs"

          required_packages=(
            e87n-bypass-defaults fancontrol display-control luci-app-e87n-control-center
            luci-app-passwall xray-core mosdns adguardhome
            strongswan luci-app-ipsec-vpnd ddns-scripts luci-app-ddns
            luci-app-upnp vlmcsd luci-app-vlmcsd ttyd luci-app-ttyd
            luci-app-eqos-mtk luci-app-turboacc-mtk luci-app-wrtbwmon
            luci-app-statistics luci-app-netdata netdata
            luci-app-openvpn openvpn-openssl
            luci-proto-wireguard wireguard-tools kmod-wireguard
            luci-app-timewol luci-app-ramfree luci-app-watchcat watchcat
          )
          for package in "${required_packages[@]}"; do
            grep -q "^${package} -" "$manifest" || {
              echo "missing from manifest: ${package}" >&2
              exit 1
            }
          done

          if grep -E '^(sing-box|geoview|docker|dockerd|containerd|runc|luci-app-dockerman|samba4-server|samba4-libs|ksmbd-server|luci-app-samba4|luci-app-ksmbd|luci-app-diskman|luci-app-vsftpd|vsftpd|autoksmbd|autosamba|luci-app-modem|luci-app-WTModem|luci-app-qmodem|luci-app-qmodem-sms|luci-app-qmodem-ttl|qmodem|tom_modem|kmod-cfg80211|kmod-mac80211|kmod-mt76-core|kmod-mt7921e|kmod-mt7922-firmware|wpad-openssl|hostapd-utils|wifi-scripts|wireless-tools|iw|iw-full|iwinfo|libiwinfo|rpcd-mod-iwinfo) -' "$manifest"; then
            echo 'forbidden package found in image manifest' >&2
            exit 1
          fi

          (cd "$target" && sha256sum *edgepi_e87n*.bin > e87n-bypass-sha256sums)
          cp e87n-bypass.diffconfig "$target/"
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "passwall_luci=d9373af2f74fe9efabcfe57b257a047e445c8e07"
            echo "passwall_packages=b4f719f44343b6f62d5c21e14da0c844b21a58ed"
            echo "management_ip=192.168.88.1"
            echo "e87n_luci_control_center=1.0.0"
            echo "vendor_reference_sha256=e1f18b9085cae89193d5e1f57b560d4b1bacae9f71d9ad64cc40dea678669f38"
            echo "vendor_router_features=eqos,turboacc,wrtbwmon,statistics,netdata,openvpn,wireguard,timewol,ramfree,watchcat"
            echo "wireless=excluded"
            echo "nas_docker_cpe=excluded"
            echo "sing_box=excluded_go_1.24_requirement"
            echo "geoview=excluded_go_1.25_requirement"
            echo "xray_core_version=24.12.31"
            echo "xray_package_commit=825aa3a00ad839f3f2521f7e06750a271dabae17"
            date -u '+built_at=%Y-%m-%dT%H:%M:%SZ'
          } > "$target/e87n-bypass-build-evidence.txt"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: E87N-wired-bypass-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            bin/targets/mediatek/filogic/*edgepi_e87n-initramfs-kernel.bin
            bin/targets/mediatek/filogic/*edgepi_e87n-squashfs-sysupgrade.bin
            bin/targets/mediatek/filogic/*edgepi_e87n.manifest
            bin/targets/mediatek/filogic/profiles.json
            bin/targets/mediatek/filogic/config.buildinfo
            bin/targets/mediatek/filogic/feeds.buildinfo
            bin/targets/mediatek/filogic/version.buildinfo
            bin/targets/mediatek/filogic/e87n-bypass.diffconfig
            bin/targets/mediatek/filogic/e87n-bypass-sha256sums
            bin/targets/mediatek/filogic/e87n-bypass-build-evidence.txt
